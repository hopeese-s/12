version: '3.8'

services:
  omniload:
    build: .
    container_name: omniload-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - DOCKER=1
      - AUTO_CLEANUP_HOURS=24
      - MAX_CONCURRENT=4
    volumes:
      - ./downloads:/app/downloads
      - ./settings.json:/app/settings.json
